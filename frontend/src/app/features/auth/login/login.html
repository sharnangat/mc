<div class="auth-shell">
  <div class="card auth-card">
    <h2>Log in</h2>
    <p class="subtitle">Welcome back. Sign in to continue your consultations.</p>

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <div class="btn-row">
        <button type="submit" class="btn" [disabled]="submitting()">
          {{ submitting() ? 'Logging in...' : 'Log in' }}
        </button>
      </div>
    </form>

    <p class="auth-footer">No account? <a routerLink="/auth/register">Register here</a></p>
  </div>
</div>
