<div class="auth-shell">
  <div class="card auth-card">
    <h2>Create an account</h2>
    <p class="subtitle">Get expert-verified metallurgical answers, backed by AI.</p>

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" [(ngModel)]="fullName" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </div>

      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input id="phone" name="phone" type="text" [(ngModel)]="phone" />
      </div>

      <div class="field">
        <label for="companyName">Company (optional)</label>
        <input id="companyName" name="companyName" type="text" [(ngModel)]="companyName" />
      </div>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <div class="btn-row">
        <button type="submit" class="btn" [disabled]="submitting()">
          {{ submitting() ? 'Creating account...' : 'Register' }}
        </button>
      </div>
    </form>

    <p class="auth-footer">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</div>
