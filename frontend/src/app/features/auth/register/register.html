<div class="card" style="max-width: 420px; margin: 2rem auto;">
  <h2>Create an account</h2>

  <form (ngSubmit)="submit()">
    <div class="field">
      <label for="fullName">Full name</label>
      <input id="fullName" name="fullName" type="text" [(ngModel)]="fullName" required />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="new-password"
      />
    </div>

    <div class="field">
      <label for="phone">Phone (optional)</label>
      <input id="phone" name="phone" type="text" [(ngModel)]="phone" />
    </div>

    <div class="field">
      <label for="companyName">Company (optional)</label>
      <input id="companyName" name="companyName" type="text" [(ngModel)]="companyName" />
    </div>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <div class="btn-row">
      <button type="submit" class="btn" [disabled]="submitting()">
        {{ submitting() ? 'Creating account...' : 'Register' }}
      </button>
    </div>
  </form>

  <p style="margin-top: 1rem; font-size: 0.9rem;">
    Already have an account? <a routerLink="/login">Log in</a>
  </p>
</div>
