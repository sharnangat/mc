<div class="card">
  <div class="page-header">
    <h2>Consultation Pricing</h2>
  </div>

  @if (loading()) {
    <div class="loading-state">
      <span class="spinner"></span>
      <span>Loading pricing plans...</span>
    </div>
  } @else {
    <table>
      <thead>
        <tr>
          <th>Plan</th>
          <th>Description</th>
          <th>Price (₹)</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (plan of plans(); track plan.id) {
          <tr>
            <td>{{ plan.name }}</td>
            <td class="meta">{{ plan.description }}</td>
            <td>
              <div class="relative inline-block">
                <span class="pointer-events-none absolute top-1/2 left-2.5 -translate-y-1/2 text-[13px] font-semibold text-slate-400"
                  >₹</span
                >
                <input
                  type="number"
                  min="0"
                  step="1"
                  class="input-price font-mono !pl-6"
                  [(ngModel)]="drafts[plan.id]"
                  [name]="'price-' + plan.id"
                />
              </div>
            </td>
            <td>
              <button
                type="button"
                class="btn secondary sm"
                [disabled]="savingId() === plan.id || drafts[plan.id] === plan.price_inr"
                (click)="save(plan)"
              >
                {{ savingId() === plan.id ? 'Saving...' : 'Save' }}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
