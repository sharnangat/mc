# Nginx site config for the Metallurgical Consultation app.
#
# Serves the Angular build as static files and reverse-proxies /api/ to the
# FastAPI backend (uvicorn, listening on 127.0.0.1:8000 - see
# deploy/systemd/mc-backend.service). Same-origin /api avoids CORS and the
# path collisions that would occur if the Angular SPA routes (/queries,
# /chat, /admin/..., /expert/...) and the backend's router prefixes lived
# at the same paths on the same origin.
#
# Install once: copy to /etc/nginx/sites-available/mc.conf, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`. The Jenkins pipeline
# does not touch this file - only /opt/mc/current, which it repoints via
# release symlink on every deploy.

server {
    listen 80;
    server_name _;

    root /opt/mc/current/frontend-dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
