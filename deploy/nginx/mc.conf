# Nginx site for the Metallurgical Consultation app on its own server.
#
#   /mc/        Angular production build
#   /mc/api/    FastAPI on 127.0.0.1:8000 (prefix stripped)
#   /           redirects to /mc/
#
# Installed by deploy/scripts/ubuntu-deploy.sh.
# The shared multi-app config is deploy/nginx/nginx-all.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 300M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /mc/api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }

    location = /mc/health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # ^~ keeps the static-asset regex from taking /mc/*.js and /mc/*.css
    location ^~ /mc/ {
        alias /opt/mc/current/frontend-dist/;
        try_files $uri $uri/ /mc/index.html;
    }

    location = /mc/index.html {
        alias /opt/mc/current/frontend-dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /mc {
        return 301 /mc/;
    }

    location = / {
        return 302 /mc/;
    }
}
