# Unified Nginx site config for all three apps on one server / IP.
#
# Install:
#   sudo cp /root/deploy/nginx/nginx-all.conf /etc/nginx/sites-available/all-apps
#   sudo ln -sf /etc/nginx/sites-available/all-apps /etc/nginx/sites-enabled/all-apps
#   sudo rm -f /etc/nginx/sites-enabled/{default,scm,mc,360feedback}
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing (one server block, path-separated to avoid /api/ collisions):
#   /              -> SCM (UnoStar Supply Chain BI)          backend :8091  /api/
#   /mc/           -> MC  (Metallurgical Consultation)      backend :8000  /mc/api/
#   /feedback/     -> 360 Feedback                          backend :5000  /feedback/api/
#   /jenkins/      -> Jenkins CI                            backend :8080  /jenkins/
#
# Deploy paths (override if yours differ):
#   SCM frontend : /opt/scm/frontend
#   MC frontend  : /opt/mc/current/frontend-dist
#   360 frontend : /var/www/360feedback
#
# Required production build settings:
#   SCM        - served at root; apiBaseUrl stays /api
#   MC         - ng build --base-href /mc/  ;  apiBaseUrl: '/mc/api'
#   360feedback - PUBLIC_URL=/feedback REACT_APP_API_URL=/feedback/api npm run build
#
# TLS: after DNS is set, run:  certbot --nginx -d your-domain.com

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 300M;

    # SCM is the default app at /
    root /opt/scm/frontend;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # -------------------------------------------------------------------------
    # SCM API (Spring Boot on 127.0.0.1:8091, controllers already under /api/**)
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # MC API (FastAPI on 127.0.0.1:8000; backend routes have no /api prefix)
    # -------------------------------------------------------------------------
    location /mc/api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mc/health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # 360 Feedback API (Express on 127.0.0.1:5000, routes under /api/**)
    # -------------------------------------------------------------------------
    location /feedback/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # MC frontend (Angular, built with --base-href /mc/)
    # ^~ prevents the static-file regex below from stealing /mc/*.js, /mc/*.css
    # -------------------------------------------------------------------------
    location ^~ /mc/ {
        alias /opt/mc/current/frontend-dist/;
        try_files $uri $uri/ /mc/index.html;
    }

    location = /mc/index.html {
        alias /opt/mc/current/frontend-dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /mc {
        return 301 /mc/;
    }

    # -------------------------------------------------------------------------
    # 360 Feedback frontend (React, built with PUBLIC_URL=/feedback)
    # ^~ prevents the static-file regex below from stealing /feedback/static/*
    # -------------------------------------------------------------------------
    location ^~ /feedback/ {
        alias /var/www/360feedback/;
        try_files $uri $uri/ /feedback/index.html;
    }

    location = /feedback {
        return 301 /feedback/;
    }

    location = /feedback/index.html {
        alias /var/www/360feedback/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # SCM frontend (Angular SPA at root)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Static asset caching (all apps)
    # -------------------------------------------------------------------------
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

# HTTPS: same apps as port 80, plus Jenkins at /jenkins/
# Certs installed by: sudo bash /root/mc/deploy/scripts/setup-jenkins-https.sh
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    client_max_body_size 300M;

    ssl_certificate     /etc/nginx/ssl/jenkins/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/jenkins/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    root /opt/scm/frontend;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mc/api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mc/health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location /feedback/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /mc/ {
        alias /opt/mc/current/frontend-dist/;
        try_files $uri $uri/ /mc/index.html;
    }

    location = /mc/index.html {
        alias /opt/mc/current/frontend-dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /mc {
        return 301 /mc/;
    }

    location ^~ /feedback/ {
        alias /var/www/360feedback/;
        try_files $uri $uri/ /feedback/index.html;
    }

    location = /feedback {
        return 301 /feedback/;
    }

    location = /feedback/index.html {
        alias /var/www/360feedback/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Jenkins CI (prefix /jenkins on the Java process)
    # ^~ prevents the static-file regex below from stealing /jenkins/static/*
    location ^~ /jenkins/ {
        proxy_pass http://127.0.0.1:8080/jenkins/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_redirect http:// https://;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        send_timeout 90s;
    }

    location = /jenkins {
        return 301 /jenkins/;
    }

    # Old bookmarks from when Jenkins was at HTTPS root
    location = /login {
        return 301 /jenkins/login$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
