# Jenkins location blocks for the unified HTTPS server (included in nginx-all.conf).
# Jenkins must run with JENKINS_PREFIX=/jenkins (see setup-jenkins-https.sh).
# ^~ prevents the static-file regex from stealing /jenkins/static/*.

location ^~ /jenkins/ {
    proxy_pass http://127.0.0.1:8080/jenkins/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_redirect http:// https://;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 90s;
    send_timeout 90s;
}

location = /jenkins {
    return 301 /jenkins/;
}

location = /login {
    return 301 /jenkins/login$is_args$args;
}
