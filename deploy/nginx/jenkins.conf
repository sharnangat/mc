# Jenkins reverse proxy with TLS.
#
# Install:
#   sudo bash deploy/scripts/setup-jenkins-https.sh
#
# Optional Let's Encrypt (requires DNS A record):
#   sudo JENKINS_DOMAIN=ci.example.com bash deploy/scripts/setup-jenkins-https.sh

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/jenkins/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/jenkins/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Jenkins UI + webhooks + agent connections over HTTP(S)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_redirect http:// https://;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        send_timeout 90s;
    }
}
